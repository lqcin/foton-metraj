name: Android APK Olustur

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]
    paths-ignore:
      - "README.md"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Kodu al
        uses: actions/checkout@v4

      - name: Java 17 kur
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Android SDK hazirla
        uses: android-actions/setup-android@v4
        with:
          packages: "platform-tools"

      - name: Android 35 bilesenlerini kur
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Gradle 8.7 kur
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Debug APK derle
        run: gradle --no-daemon :app:assembleDebug --stacktrace

      - name: APK adini duzenle
        run: cp app/build/outputs/apk/debug/app-debug.apk FOTON-Crawler-Metraj-v0.6.0-debug.apk

      - name: APK artifact yukle
        uses: actions/upload-artifact@v4
        with:
          name: FOTON-Crawler-Metraj-v0.6.0
          path: FOTON-Crawler-Metraj-v0.6.0-debug.apk
          if-no-files-found: error
          retention-days: 30
